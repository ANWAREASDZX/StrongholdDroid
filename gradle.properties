# StrongholdDroid Gradle properties
# Optimize the build for headless CI and local development.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# NDK / CMake
android.ndkVersion=26.1.10909125
android.defaults.buildfeatures.buildconfig=true

# Disable dexing while iterating on debug builds to save CI time
android.experimental.enableNewResourceShrinkerPreciseShrinking=true
