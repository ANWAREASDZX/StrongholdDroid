version: 2.1

# ============================================================
# بناء حزمة وقت التشغيل qalabox-runtime.qbxruntime كاملة
# السكربت: runtime-src/build_runtime_package.sh في مستودع QalaBox العام
# كل السجل يُلتقط ويُخزَّن artifact حتى عند الفشل (when: always)
# ============================================================

jobs:
  runtime:
    docker:
      - image: cimg/base:current
    environment:
      TERM: xterm
    steps:
      - run:
          name: "البناء الكامل مع التقاط السجل"
          command: |
            set -o pipefail
            mkdir -p /tmp/out
            {
              echo "=== [1] أدوات البناء المتقاطع ==="
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends \
                cmake g++-aarch64-linux-gnu g++-arm-linux-gnueabihf \
                git curl xz-utils unzip zip python3
              echo "=== [2] سحب مصدر QalaBox ==="
              git clone --depth 1 https://github.com/ANWAREASDZX/QalaBox.git /tmp/qalabox
              git -C /tmp/qalabox log --oneline -1
              echo "=== [3] بناء الحزمة ==="
              bash /tmp/qalabox/runtime-src/build_runtime_package.sh /tmp/out
            } 2>&1 | tee /tmp/out/build-log.txt

      - store_artifacts:
          path: /tmp/out
          destination: out
          when: always

workflows:
  runtime-build:
    jobs:
      - runtime
