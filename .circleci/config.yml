version: 2.1
jobs:
  smoke-test:
    docker:
      - image: cimg/base:2024.07
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Smoke test
          command: |
            echo "Hello from CircleCI"
            uname -a
            docker --version
            free -h
            df -h
            env | grep -i circle | head -5
      - run:
          name: Verify Docker availability
          command: |
            docker info 2>&1 | head -10
            echo "Docker works"
workflows:
  version: 2
  smoke:
    jobs:
      - smoke-test
