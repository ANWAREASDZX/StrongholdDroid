# StrongholdDroid — CircleCI build pipeline
#
# Free-tier feasibility (as of 2025-01):
#   - Free plan: 6000 credits/month
#   - Linux medium (2 vCPU, 4 GB):  10 credits/min  → 70 min build ≈ 700 credits
#   - Linux large  (4 vCPU, 8 GB):  15 credits/min  → 70 min build ≈ 1050 credits
#   - Docker layer caching + ccache cut subsequent rebuilds to ~15 min
#
# Recommended resource_class: `large` for first build (faster Wine/Box64
# compile), downgrade to `medium` once cache is warm.
#
# IMPORTANT — do NOT hard-code secrets in this file. Use CircleCI project
# Environment Variables (Project Settings → Environment Variables) for:
#   STRONGHOLDDROID_KEYSTORE          (base64 of release keystore .jks)
#   STRONGHOLDDROID_STORE_PASSWORD    (keystore password)
#   STRONGHOLDDROID_KEY_ALIAS         (key alias)
#   STRONGHOLDDROID_KEY_PASSWORD      (key password)
# These are only consumed by the release variant; debug/ci builds do
# not need them.

version: 2.1

# ---------------------------------------------------------------------------
# Orbs — small reusable CircleCI packages.
# ---------------------------------------------------------------------------
orbs:
  # android: circleci/android@2.1.5   # not used: we run gradle inside the
  #                                  # same Docker image so we don't depend
  #                                  # on a separate Android executor.

# ---------------------------------------------------------------------------
# Executors — runtime environments for jobs.
# ---------------------------------------------------------------------------
executors:
  docker-builder:
    docker:
      # cimg/base is CircleCI's Ubuntu 22.04 image with docker pre-installed.
      - image: cimg/base:2024.07
    resource_class: large
    working_directory: ~/project

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # -------------------------------------------------------------------------
  # native-build — produces libwine.so, libbox64.so, libpulse.so,
  # libdxvk_loader.so, libGL.so, and the Wine/DXVK DLLs.
  # -------------------------------------------------------------------------
  native-build:
    executor: docker-builder
    steps:
      - checkout

      # Docker layer caching saves ~10 min on every build after the first.
      # The Dockerfile rarely changes, so the apt + SDK + NDK layers
      # remain warm across commits.
      - setup_remote_docker:
          # DLC (Docker Layer Caching) caches individual Dockerfile layers
          # across builds. Note: the `version` parameter is deprecated as of
          # Nov 2024 — CircleCI now uses Docker 25.x+ by default.
          docker_layer_caching: true

      - restore_cache:
          name: Restore ccache
          # Note: do NOT use {{ epoch }} in restore_cache keys — epoch is
          # unique per restore call, so it would never match a saved cache.
          # Use partial-key matching (keys are tried in order, longest first).
          keys:
            - strongholddroid-ccache-{{ arch }}-{{ .Branch }}-
            - strongholddroid-ccache-{{ arch }}-main-
            - strongholddroid-ccache-{{ arch }}-

      - run:
          name: Build Docker image (DLC handles layer caching)
          # NOTE: do NOT use buildx-style --cache-from/--cache-to flags here.
          # The default `docker` driver doesn't support local cache export
          # and CircleCI's DLC (setup_remote_docker: docker_layer_caching:
          # true) already caches Dockerfile layers across builds.
          command: |
            docker build \
              -t strongholddroid-builder:latest \
              -f scripts/docker/Dockerfile.build scripts/docker

      - run:
          name: Cross-compile native libraries (Wine, Box64, DXVK, gl4es, Pulse)
          # ~60 minutes cold, ~10-15 minutes warm with ccache.
          #
          # IMPORTANT: CircleCI's `setup_remote_docker` provisions the
          # Docker daemon on a SEPARATE VM from the build runner. Bind
          # mounts like `-v $PWD:/work` DON'T WORK because the runner's
          # filesystem isn't visible to the daemon VM. We use the
          # `docker create` + `docker cp` + `docker start` pattern
          # instead — this works with remote Docker and preserves
          # execute bits on shell scripts.
          command: |
            set -ex
            mkdir -p build/ccache app/src/main/cpp/prebuilt
            # 1) Create a stopped container with the build entrypoint.
            docker create \
                --name native-builder \
                -e CCACHE_DIR=/work/build/ccache \
                -e CCACHE_COMPRESS=1 \
                -w /work \
                strongholddroid-builder:latest \
                bash -c 'chmod +x /work/scripts/*.sh && /work/scripts/build_all.sh'
            # 2) Copy project source into the container (excludes .git).
            tar --exclude='.git' --exclude='build/ccache' -cf - . \
              | docker cp - native-builder:/work/
            # 3) Run the build (stream stdout/stderr to console).
            docker start -a native-builder
            # 4) Extract artifacts back to the runner for downstream steps.
            docker cp native-builder:/work/app/src/main/cpp/prebuilt/. ./app/src/main/cpp/prebuilt/
            docker cp native-builder:/work/build/ccache/. ./build/ccache/
            # 5) Clean up.
            docker rm native-builder
            ls -lh app/src/main/cpp/prebuilt/arm64-v8a/ | head -20
          no_output_timeout: 75m

      - run:
          name: Validate prebuilt artifacts
          command: |
            test -f app/src/main/cpp/prebuilt/arm64-v8a/libwine/wine
            test -f app/src/main/cpp/prebuilt/arm64-v8a/libwine/wineserver
            test -f app/src/main/cpp/prebuilt/arm64-v8a/wow64/wowbox64.dll
            test -f app/src/main/cpp/prebuilt/arm64-v8a/libpulse.so
            test -f app/src/main/cpp/prebuilt/arm64-v8a/libGL.so
            test -f app/src/main/cpp/prebuilt/arm64-v8a/wine_dlls/aarch64-windows/kernel32.dll
            test -f app/src/main/cpp/prebuilt/arm64-v8a/wine_dlls/i386-windows/kernel32.dll
            test -f app/src/main/cpp/prebuilt/arm64-v8a/wine_dlls/aarch64-unix/ntdll.so
            test -d app/src/main/cpp/prebuilt/arm64-v8a/dxvk-wine-dlls
            echo "All prebuilt artifacts present"
            ls -lh app/src/main/cpp/prebuilt/arm64-v8a/

      - persist_to_workspace:
          name: Persist prebuilt to workspace
          root: .
          paths:
            - app/src/main/cpp/prebuilt/
            - build/ccache/

      - save_cache:
          name: Save ccache
          key: strongholddroid-ccache-{{ arch }}-{{ .Branch }}-{{ epoch }}
          paths:
            - build/ccache/

  # -------------------------------------------------------------------------
  # build-apk — depends on native-build. Produces debug + ci APKs.
  # -------------------------------------------------------------------------
  build-apk:
    executor: docker-builder
    steps:
      - checkout

      - attach_workspace:
          at: ~/project

      # IMPORTANT: the Docker image built in the native-build job does NOT
      # persist between jobs (each job gets a fresh remote-Docker VM).
      # The build-apk job must rebuild the image itself — with Docker Layer
      # Caching enabled this is nearly instant (all layers are warm).
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image (DLC cache — instant after first build)
          command: |
            docker build \
              -t strongholddroid-builder:latest \
              -f scripts/docker/Dockerfile.build scripts/docker

      - run:
          name: Build debug + ci APKs
          # Same `docker create + cp + start` pattern as native-build —
          # see that job for the rationale (remote Docker doesn't see
          # the runner's filesystem).
          command: |
            set -ex
            docker create \
                --name apk-builder \
                -w /work \
                strongholddroid-builder:latest \
                bash -c 'chmod +x /work/scripts/*.sh && /work/scripts/build_apk.sh debug && /work/scripts/build_apk.sh ci'
            tar --exclude='.git' --exclude='build/ccache' --exclude='app/build' -cf - . \
              | docker cp - apk-builder:/work/
            docker start -a apk-builder
            docker cp apk-builder:/work/app/build/outputs/apk/. ./app/build/outputs/apk/
            # assets/prebuilt.zip is produced inside the container by
            # build_apk.sh — copy it back so it shows up in the artifacts.
            docker cp apk-builder:/work/app/src/main/assets/prebuilt.zip ./app/src/main/assets/prebuilt.zip || true
            docker rm apk-builder
          no_output_timeout: 30m

      - run:
          name: Sign release APK (only on tag)
          # The release variant is gated to tag pushes so we don't burn
          # free-tier credits on every commit. Same create+cp+start pattern.
          # NOTE: keystore file is also copied via `docker cp` (not bind
          # mounted) for the same remote-Docker reason.
          command: |
            if [[ -z "${STRONGHOLDDROID_KEYSTORE:-}" ]]; then
              echo "No release keystore configured — skipping release build"
              exit 0
            fi
            set -ex
            echo "${STRONGHOLDDROID_KEYSTORE}" | base64 -d > /tmp/keystore.jks
            docker create \
                --name apk-release \
                -e STRONGHOLDDROID_KEYSTORE=/tmp/keystore.jks \
                -e STRONGHOLDDROID_STORE_PASSWORD \
                -e STRONGHOLDDROID_KEY_ALIAS \
                -e STRONGHOLDDROID_KEY_PASSWORD \
                -w /work \
                strongholddroid-builder:latest \
                bash -c 'chmod +x /work/scripts/*.sh && /work/scripts/build_apk.sh release'
            tar --exclude='.git' --exclude='build/ccache' -cf - . \
              | docker cp - apk-release:/work/
            docker cp /tmp/keystore.jks apk-release:/tmp/keystore.jks
            docker start -a apk-release
            docker cp apk-release:/work/app/build/outputs/apk/. ./app/build/outputs/apk/
            docker rm apk-release
          no_output_timeout: 30m

      - store_artifacts:
          name: Store APK artifacts
          path: app/build/outputs/apk/
          destination: strongholddroid-apks

      - run:
          name: Print APK summary
          command: |
            echo "=== Built APKs ==="
            find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

# ---------------------------------------------------------------------------
# Workflows — orchestrate jobs across branches and tags.
# ---------------------------------------------------------------------------
workflows:
  version: 2

  # Default build — runs on every push to main/develop.
  build:
    jobs:
      - native-build:
          filters:
            branches:
              only: [main, develop]
      - build-apk:
          requires: [native-build]
          filters:
            branches:
              only: [main, develop]

  # Release build — only runs on tag pushes (v0.1.0, v0.2.0, etc.)
  release:
    jobs:
      - native-build:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+(-[a-z0-9.]+)?$/
      - build-apk:
          requires: [native-build]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+(-[a-z0-9.]+)?$/

# Build verification trigger — $(date -u +%Y-%m-%dT%H:%M:%SZ)
# This comment is a no-op marker; the only purpose is to create a new git
# commit on main so CircleCI's GitHub App receives a fresh push event.
